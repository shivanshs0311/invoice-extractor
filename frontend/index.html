<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #e8ecf0;
    --paper: #ffffff;
    --ink: #141c26;
    --muted: #5a6574;
    --rule: #c9d1da;
    --ledger: #dcebe2;
    --green: #0f5c3a;
    --green-soft: #e3f2ea;
    --amber: #8a5300;
    --amber-soft: #fff1d1;
    --red: #b3261e;
    --red-soft: #fde7e5;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* author display rules (flex, grid) would otherwise beat the hidden attribute */
  html { color-scheme: light; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--rule); background: var(--paper); }
  header h1 { margin: 0; font: 600 20px/1 var(--serif); letter-spacing: .01em; }
  #config { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; padding: 20px 24px 40px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 14px; } header { padding: 12px 14px; } }

  .pane { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; min-height: 420px; }
  .pane-title { margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--rule); font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  /* Left: drop zone and preview */
  #drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 520px; margin: 16px; border: 1.5px dashed var(--rule); border-radius: 4px; text-align: center; padding: 24px; cursor: pointer; transition: background-color .15s, border-color .15s; }
  #drop:hover, #drop.over, #drop:focus-within { background: var(--green-soft); border-color: var(--green); }
  #drop strong { font: 600 22px/1.2 var(--serif); }
  #drop span { color: var(--muted); }
  #drop .btn { color: #fff; }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .btn { appearance: none; border: 1px solid var(--green); background: var(--green); color: #fff; font: 500 14px var(--sans); padding: 8px 14px; border-radius: 3px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--green); }
  .btn:focus-visible, summary:focus-visible, a:focus-visible, #drop:focus-within { outline: 2px solid var(--green); outline-offset: 2px; }
  #preview { padding: 12px; }
  #preview iframe, #preview img { width: 100%; height: 640px; border: 1px solid var(--rule); border-radius: 3px; background: #f4f6f8; display: block; }
  #preview img { object-fit: contain; }
  #preview .fallback { margin: 8px 2px 0; color: var(--muted); font-size: 13px; }

  /* Right: ledger */
  .ledger { padding: 0 0 8px; }
  .empty, .loading, .failure { padding: 28px 20px; }
  .empty p { margin: 0 0 6px; color: var(--muted); max-width: 46ch; }
  .loading strong { font: 600 20px var(--serif); }
  .bar { height: 3px; background: var(--rule); margin-top: 14px; overflow: hidden; border-radius: 2px; }
  .bar i { display: block; height: 100%; width: 35%; background: var(--green); animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .5; } #drop { transition: none; } }

  .verdict { padding: 18px 20px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .verdict h2 { margin: 0; font: 600 26px/1.2 var(--serif); overflow-wrap: anywhere; }
  .verdict .sub { color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .stamp { margin: 12px 0 8px; padding: 10px 12px; border: 1.5px solid; border-radius: 3px; }
  .stamp.ok { color: var(--green); background: var(--green-soft); border-color: var(--green); }
  .stamp.review { color: var(--amber); background: var(--amber-soft); border-color: var(--amber); }
  .stamp.fail { color: var(--red); background: var(--red-soft); border-color: var(--red); }
  .stamp b { display: block; font-weight: 600; }
  .stamp ul { margin: 4px 0 0; padding-left: 18px; }
  .stamp p { margin: 2px 0 0; }

  dl.fields { margin: 0; padding: 0 20px; background: var(--paper); }
  dl.fields > div { display: grid; grid-template-columns: 22px 150px 1fr; align-items: baseline; min-height: 36px; padding: 6px 0; border-bottom: 1px solid var(--ledger); }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .mark { color: var(--green); font-weight: 600; }
  .mark.bad { color: var(--red); }
  .missing { color: var(--red); font-style: italic; }

  .section { margin: 18px 20px 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  table.items { width: calc(100% - 40px); margin: 6px 20px 0; border-collapse: collapse; background: var(--paper); }
  table.items th { text-align: left; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--ink); padding: 6px 8px 6px 0; }
  table.items td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--ledger); vertical-align: top; }
  table.items .num { text-align: right; white-space: nowrap; padding-right: 0; }
  table.items .neg { color: var(--red); }

  .tape { margin: 14px 20px 0; padding: 10px 14px; background: var(--paper); border: 1px solid var(--rule); max-width: 380px; margin-left: auto; margin-right: 20px; }
  .tape .row { display: flex; justify-content: space-between; gap: 18px; padding: 2px 0; }
  .tape .row.sum { border-top: 1px solid var(--ink); margin-top: 4px; padding-top: 6px; font-weight: 600; }
  .tape .row.total { font-weight: 600; border-bottom: 3px double var(--ink); padding-bottom: 4px; margin-bottom: 4px; }
  .tape .verdict-line { font-size: 13px; margin-top: 4px; }
  .tape .good { color: var(--green); } .tape .bad { color: var(--red); }

  details { margin: 16px 20px 0; background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; }
  summary { cursor: pointer; padding: 8px 12px; font-weight: 500; }
  details .body { padding: 4px 12px 12px; font-size: 13px; color: var(--muted); }
  details table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  details th, details td { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--rule); }
  details td.num { text-align: right; }
  pre { margin: 8px 0 0; padding: 10px; max-height: 320px; overflow: auto; background: #f4f6f8; border: 1px solid var(--rule); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  #again { margin: 18px 20px 4px; }
</style>
</head>
<body>
<header>
  <h1>Invoice desk</h1>
  <div id="config" aria-live="polite"></div>
</header>

<main>
  <section class="pane" aria-label="Document">
    <h2 class="pane-title"><span>Document</span><button id="again" class="btn ghost" type="button" hidden>Check another file</button></h2>
    <label id="drop">
      <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp,application/pdf,image/*">
      <strong>Drop an invoice here</strong>
      <span>PDF, JPG, PNG or WEBP, up to <span id="limit">20</span> MB</span>
      <span class="btn" aria-hidden="true">Choose a file</span>
    </label>
    <div id="preview" hidden></div>
  </section>

  <section class="pane" aria-label="Extracted fields" aria-live="polite">
    <h2 class="pane-title"><span>Extracted fields</span></h2>
    <div id="result" class="ledger">
      <div class="empty">
        <p>Upload a document and the fields appear here, next to the original.</p>
        <p>Every result is checked: the line items plus tax must add up to the total. Anything that does not is marked for review instead of passed on.</p>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const result = $("#result"), drop = $("#drop"), input = $("#file"), preview = $("#preview"), again = $("#again");
  let maxMb = 20, objectUrl = null, timer = null;

  function el(tag, attrs = {}, ...kids) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null) node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return node; // all content goes in as text nodes, never as HTML, because document text is untrusted
  }

  const REASONS = {
    totals_reconcile: "The line items plus tax do not add up to the total.",
    totals_unverifiable: "The total could not be checked because line items or the total are missing.",
    core_fields_present: "A required field (vendor, invoice number, date, total or line items) was not found.",
    document_type_consistent: "The document type and the invoice flag disagree.",
    currency_known: "The currency is missing or not a recognised code.",
    date_plausible: "The invoice date looks implausible.",
    tax_plausible: "The tax amount looks implausible next to the total.",
    legibility_good: "The document was hard to read.",
    confidence_ok: "The model reported low confidence.",
    input_quality_ok: "Input quality issue: low resolution or pages were cut off.",
    non_invoice_fields_null: "The model returned invoice fields for a non-invoice. They were cleared."
  };
  const FAILS = {
    corrupt_file: "The file is damaged and cannot be opened. Export it again from the source.",
    empty_file: "The file is empty.",
    encrypted_pdf: "The PDF is password protected. Remove the password and upload it again.",
    blank_document: "The page looks blank. Check that the scan captured the document.",
    unsupported_type: "This file type is not supported. Use PDF, JPG, PNG or WEBP.",
    file_too_large: "The file is over the size limit.",
    api_auth: "The server has no valid API key. Set GEMINI_API_KEY in .env and restart.",
    api_quota: "The daily free-tier quota for this model is used up. It resets at midnight Pacific time.",
    api_server_error: "The model service is overloaded right now. Try again in a minute.",
    unreadable_document: "The scan is too poor to read reliably. Send a clearer scan or photo.",
    api_timeout: "The model took too long to answer. Try again.",
    api_rate_limit: "The model service is rate limiting requests. Wait a moment and try again.",
    api_connection: "The server could not reach the model service."
  };

  const fmt = (n, cur) => (n == null ? "" : new Intl.NumberFormat(cur === "INR" ? "en-IN" : "en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n));
  const usd = (n) => (n == null ? "n/a" : "$" + (n < 0.1 ? n.toFixed(5) : n.toFixed(3)));

  fetch("/api/health").then((r) => r.json()).then((h) => {
    maxMb = h.max_file_mb; $("#limit").textContent = String(maxMb);
    $("#config").textContent = h.model + (h.escalation_model ? ", then " + h.escalation_model + " when a check fails" : "") + " | mode " + h.mode;
  }).catch(() => { $("#config").textContent = "Server not reachable"; });

  function showPreview(file) {
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    preview.replaceChildren(
      isPdf ? el("iframe", { src: objectUrl, title: "Uploaded document" }) : el("img", { src: objectUrl, alt: "Uploaded document" }),
      el("p", { class: "fallback" }, "If the preview is blank, ", el("a", { href: objectUrl, target: "_blank", rel: "noopener" }, "open the file in a new tab"), ".")
    );
    drop.hidden = true; preview.hidden = false; again.hidden = false;
  }

  function reset() {
    clearInterval(timer);
    drop.hidden = false; preview.hidden = true; again.hidden = true; input.value = "";
    result.replaceChildren(el("div", { class: "empty" }, el("p", {}, "Upload a document and the fields appear here, next to the original.")));
  }

  function loading() {
    const t = el("span", {}, "0s"); const started = Date.now();
    clearInterval(timer);
    timer = setInterval(() => { t.textContent = Math.round((Date.now() - started) / 1000) + "s"; }, 500);
    result.replaceChildren(el("div", { class: "loading" }, el("strong", {}, "Reading the document"), el("div", {}, "Elapsed ", t), el("div", { class: "bar" }, el("i"))));
  }

  function failure(title, message) {
    clearInterval(timer);
    result.replaceChildren(el("div", { class: "failure" }, el("div", { class: "stamp fail" }, el("b", {}, title), el("p", {}, message))));
  }

  async function handle(file) {
    if (!file) return;
    if (file.size > maxMb * 1024 * 1024) { failure("File is too large", "The limit is " + maxMb + " MB."); return; }
    showPreview(file); loading();
    const body = new FormData(); body.append("file", file);
    try {
      const res = await fetch("/api/extract", { method: "POST", body });
      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || "Server returned " + res.status); }
      render(await res.json());
    } catch (err) { failure("Could not read the document", err.message); }
  }

  function render({ output, meta }) {
    clearInterval(timer);
    const failed = meta.status === "failed";
    if (failed) {
      const e = output.error || {};
      result.replaceChildren(el("div", { class: "failure" }, el("div", { class: "stamp fail" }, el("b", {}, "Extraction failed"), el("p", {}, FAILS[e.code] || e.message || "Unknown error."), el("p", {}, e.message && FAILS[e.code] ? e.message : ""))), runDetails(output, meta));
      return;
    }
    const cur = output.currency;
    const nodes = [];

    const head = el("div", { class: "verdict" });
    if (output.is_invoice) {
      head.append(el("h2", {}, output.vendor || "Vendor not found"));
      head.append(el("div", { class: "sub" }, el("span", {}, output.invoice_number ? "Invoice " + output.invoice_number : "No invoice number"), el("span", {}, output.invoice_date || "No date"), el("span", {}, cur || "No currency")));
    } else {
      head.append(el("h2", {}, "Not an invoice"));
      head.append(el("div", { class: "sub" }, el("span", {}, "Looks like: " + (meta.document_type || "other").replace("_", " "))));
    }
    if (output.needs_review) {
      head.append(el("div", { class: "stamp review" }, el("b", {}, "Needs review"), el("ul", {}, (output.review_reasons || []).map((c) => el("li", {}, REASONS[c] || c)))));
    } else {
      head.append(el("div", { class: "stamp ok" }, el("b", {}, "Passed all checks"), el("p", {}, output.is_invoice ? "Schema valid, and line items plus tax equal the total." : "Not an invoice, so no fields were extracted.")));
    }
    if (meta.notes) head.append(el("p", { class: "fallback" }, "Model note: " + meta.notes));
    nodes.push(head);

    if (output.is_invoice) {
      const rows = [["Vendor", output.vendor], ["Invoice number", output.invoice_number], ["Invoice date", output.invoice_date], ["Currency", output.currency], ["Tax total", output.tax_total == null ? null : fmt(output.tax_total, cur)], ["Total", output.total == null ? null : fmt(output.total, cur)]];
      nodes.push(el("dl", { class: "fields" }, rows.map(([k, v]) => el("div", {}, el("span", { class: "mark" + (v == null && k !== "Tax total" ? " bad" : ""), "aria-hidden": "true" }, v == null ? (k === "Tax total" ? "" : "!") : "\u2713"), el("dt", {}, k), el("dd", {}, v == null ? el("span", { class: "missing" }, k === "Tax total" ? "none shown" : "not found") : v)))));

      const items = output.line_items || [];
      nodes.push(el("div", { class: "section" }, "Line items (" + items.length + ")"));
      nodes.push(el("table", { class: "items" },
        el("thead", {}, el("tr", {}, el("th", {}, "Description"), el("th", { class: "num" }, "Qty"), el("th", { class: "num" }, "Amount"))),
        el("tbody", {}, items.map((it) => el("tr", {}, el("td", {}, it.description), el("td", { class: "num" }, it.quantity == null ? "" : String(it.quantity)), el("td", { class: "num" + (it.amount < 0 ? " neg" : "") }, fmt(it.amount, cur)))))));

      if (items.length && output.total != null) {
        const sum = items.reduce((a, b) => a + b.amount, 0), tax = output.tax_total || 0, calc = sum + tax, diff = Math.abs(calc - output.total);
        const check = (meta.checks || []).find((c) => c.name === "totals_reconcile");
        const good = check ? check.ok : diff <= 1;
        nodes.push(el("div", { class: "section" }, "Does it add up?"));
        nodes.push(el("div", { class: "tape" },
          el("div", { class: "row" }, el("span", {}, "Line items"), el("span", {}, fmt(sum, cur))),
          el("div", { class: "row" }, el("span", {}, "+ Tax"), el("span", {}, fmt(tax, cur))),
          el("div", { class: "row sum" }, el("span", {}, "Calculated"), el("span", {}, fmt(calc, cur))),
          el("div", { class: "row total" }, el("span", {}, "On the document"), el("span", {}, fmt(output.total, cur))),
          el("div", { class: "verdict-line " + (good ? "good" : "bad") }, good ? "Matches." : "Off by " + fmt(diff, cur) + ".")));
      }
    }
    nodes.push(runDetails(output, meta));
    result.replaceChildren(...nodes);
  }

  function runDetails(output, meta) {
    const attempts = (meta.attempts || []).map((a) => el("tr", {}, el("td", {}, String(a.attempt)), el("td", {}, a.mode + " / " + a.model), el("td", {}, a.status + (a.failed_checks && a.failed_checks.length ? " (" + a.failed_checks.join(", ") + ")" : "")), el("td", { class: "num" }, (a.input_tokens || 0).toLocaleString() + " / " + (a.output_tokens || 0).toLocaleString()), el("td", { class: "num" }, usd(a.cost_usd))));
    const json = JSON.stringify(output, null, 2);
    return el("div", {},
      el("details", {}, el("summary", {}, "How it was read"), el("div", { class: "body" },
        el("div", {}, "Source: " + (meta.source_type || "n/a") + ". Cost " + usd(meta.cost_usd) + " for " + (meta.input_tokens || 0).toLocaleString() + " tokens in and " + (meta.output_tokens || 0).toLocaleString() + " out. " + (meta.latency_s || 0).toFixed(1) + "s."),
        (meta.warnings || []).length ? el("div", {}, "Input warnings: " + meta.warnings.join(", ")) : null,
        attempts.length ? el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "#"), el("th", {}, "Route"), el("th", {}, "Result"), el("th", { class: "num" }, "Tokens in / out"), el("th", { class: "num" }, "Cost"))), el("tbody", {}, attempts)) : null)),
      el("details", {}, el("summary", {}, "JSON"), el("div", { class: "body" },
        el("div", { class: "actions" },
          el("button", { class: "btn ghost", type: "button", onclick: (e) => { navigator.clipboard.writeText(json).then(() => { e.target.textContent = "Copied"; setTimeout(() => { e.target.textContent = "Copy JSON"; }, 1500); }); } }, "Copy JSON"),
          el("button", { class: "btn ghost", type: "button", onclick: () => { const a = el("a", { href: URL.createObjectURL(new Blob([json], { type: "application/json" })), download: "invoice.json" }); a.click(); } }, "Download JSON")),
        el("pre", {}, json))));
  }

  input.addEventListener("change", () => handle(input.files[0]));
  again.addEventListener("click", reset);
  for (const ev of ["dragenter", "dragover"]) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); });
  for (const ev of ["dragleave", "drop"]) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); });
  drop.addEventListener("drop", (e) => handle(e.dataTransfer.files[0]));
})();
</script>
</body>
</html>
